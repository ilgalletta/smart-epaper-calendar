# Smart E-Paper Calendar Configuration
# Copy this file to `config.yaml` and fill in your personal values.
# Never commit `config.yaml` to version control.

general:
  timezone: "Europe/Rome"
  language: "it"
  display:
    width: 800
    height: 480
    colors: 3 # Black, White, Red (Waveshare 7.5" HAT (B))
    mock_output_path: "./output/preview.png"

calendar:
  # Public or private secret iCal (.ics) URLs
  ical_urls:
    - name: "Family"
      url: "https://calendar.google.com/calendar/ical/family10116765158045700908%40group.calendar.google.com/public/basic.ics"
      highlight: true

news:
  # RSS feeds for headlines ticker / digest
  rss_feeds:
    - name: "Il Post"
      url: "https://www.ilpost.it/feed/"
      max_items: 3

weather:
  # Open-Meteo coordinates (no API key required)
  location_name: "Home"
  latitude: 45.4642
  longitude: 9.1900

commute:
  # Home & Office coordinates or street addresses for travel-time / traffic checks
  home:
    label: "Home"
    address: "Via Example 1, 20100 Milano MI, Italy"
    latitude: 45.4642
    longitude: 9.1900
  office:
    label: "Office"
    address: "Piazza Example 10, 20100 Milano MI, Italy"
    latitude: 45.4773
    longitude: 9.1815

telegram:
  # Bot token from @BotFather (used for quick notes, reminders, or wake-up commands)
  bot_token: "YOUR_TELEGRAM_BOT_TOKEN"
  allowed_chat_ids: []

web_ui:
  # Local LAN FastAPI configuration portal
  host: "0.0.0.0"
  port: 8080
  # Generate a password hash and random secret before exposing on your LAN
  password_hash: "CHANGE_ME_PASSWORD_HASH"
  session_secret: "CHANGE_ME_RANDOM_SESSION_SECRET"

schedule:
  # Time-of-day windows control what information is prioritized on each refresh
  time_windows:
    morning:
      start: "06:30"
      end: "12:00"
      focus: ["weather", "commute", "today_events", "school_menu"]
    afternoon:
      start: "12:00"
      end: "18:00"
      focus: ["today_events", "weekly_activities", "news"]
    evening:
      start: "18:00"
      end: "23:00"
      focus: ["tomorrow_events", "tomorrow_school_menu", "news"]

power:
  # "battery_wakeup" (Witty Pi 4 Mini scheduled wake + shutdown) or "always_on" (USB power)
  mode: "battery_wakeup"
  wake_duration_seconds: 120
  # Keep Web UI alive longer when maintenance mode is toggled via Web UI or button
  maintenance_timeout_minutes: 15

weekly_activities:
  # Fixed recurring weekly family/kid activities
  monday:
    - time: "17:00"
      title: "Swimming"
  tuesday:
    - time: "16:30"
      title: "Music Lesson"
  wednesday: []
  thursday:
    - time: "17:00"
      title: "Soccer"
  friday: []
  saturday:
    - time: "10:00"
      title: "Library"
  sunday: []

school_menu:
  # Optional rotating or weekly school meal menu
  week_1:
    monday: "Pasta al pomodoro, Petto di pollo, Carote"
    tuesday: "Risotto allo zafferano, Filetto di platessa, Insalata"
    wednesday: "Minestrone, Frittata, Patate al forno"
    thursday: "Pasta al pesto, Polpette, Zucchine"
    friday: "Pizza margherita, Macedonia di frutta"
