# Smart E-Paper Calendar Configuration
# Copy this file to `config.yaml` and fill in your personal values.
# Never commit `config.yaml` to version control.

timezone: "Europe/Rome"
language: "it"

display:
  width: 800
  height: 480
  colors: 3  # Black, White, Red (Waveshare 7.5" HAT (B))
  mock_output_path: "data/preview.png"

# Public or private secret iCal (.ics) URLs
calendars:
  - name: "Family"
    url: "https://calendar.google.com/calendar/ical/family10116765158045700908%40group.calendar.google.com/public/basic.ics"
    highlight: true

# RSS feed for headlines widget
news:
  feed_url: "https://www.ilpost.it/feed/"
  max_items: 3

# Open-Meteo coordinates (no API key required)
weather:
  location_name: "Milano"
  latitude: 45.4642
  longitude: 9.1900

# Home & Office addresses / coordinates for morning commute time
commute:
  home_address: "Via Example 1, 20100 Milano MI, Italy"
  office_address: "Piazza Example 10, 20100 Milano MI, Italy"
  home_coords: [45.4642, 9.1900]
  office_coords: [45.4773, 9.1815]
  osrm_url: "https://router.project-osrm.org"
  google_maps_api_key: ""
  nominatim_user_agent: "smart-epaper-calendar/1.0"

# Milano Ristorazione (live school lunch menu)
milanoristorazione:
  enabled: true
  school_name: 'Scuola Primaria "Pietro Micca" - I.C. Statale Gattamelata'
  school_query: "Gattamelata"
  area: "C.C. Colleoni - Area 1"
  menu_url: "https://www.milanoristorazione.it/il-menu-del-giorno"
  api_url: ""
  pdf_url: ""
  pdf_path: "data/menu_scuola.pdf"
  cache_ttl_seconds: 21600

# Telegram bot token from @BotFather (for grocery list updates)
telegram:
  bot_token: ""
  allowed_chat_ids: []
  poll_timeout: 30

# Local LAN FastAPI configuration portal
web_ui:
  host: "0.0.0.0"
  port: 8080
  password: "changeme"
  session_secret: ""
  session_max_age_seconds: 604800
  preview_image_path: "data/preview.png"
  refresh_command: ""

# Time-of-day windows control what information is prioritized on each refresh
schedule:
  time_windows:
    morning:
      start: "06:30"
      end: "12:00"
      focus: ["weather", "commute", "today_events", "school_menu"]
    afternoon:
      start: "12:00"
      end: "18:00"
      focus: ["today_events", "weekly_activities", "news"]
    evening:
      start: "18:00"
      end: "23:00"
      focus: ["tomorrow_events", "tomorrow_school_menu", "news"]

power:
  # "battery_wakeup" (Witty Pi 4 Mini scheduled wake + shutdown) or "always_on" (USB power)
  mode: "battery_wakeup"
  wake_duration_seconds: 120
  maintenance_timeout_minutes: 15

# Offline/fallback school meal menu (used if milanoristorazione.it is unreachable)
school_menu:
  week_1:
    monday: "Pasta al pomodoro, Petto di pollo, Carote"
    tuesday: "Risotto allo zafferano, Filetto di platessa, Insalata"
    wednesday: "Minestrone, Frittata, Patate al forno"
    thursday: "Pasta al pesto, Polpette, Zucchine"
    friday: "Pizza margherita, Macedonia di frutta"
